services:
  frontend:
    build: ./frontend
    container_name: frontend
    restart: always
    networks:
      - converged-analytics-network
    ports:
      - "3000:80" # Maps localhost:3000 to internal Nginx port 80
  
  backend:
    build: ./backend
    container_name: backend
    ports:
      - "8000:8000"
    env_file: .env
    networks:
      - converged-analytics-network
    restart: always

networks:
  converged-analytics-network:
    external: true
    name: converged-analytics-network